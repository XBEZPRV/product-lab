<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Product Lab</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400&display=swap">
<style>
/* Layout: left-aligned editorial column on a warm paper canvas; white hairline cards; chartreuse only where you act. */
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
input,select,textarea{min-width:0;width:100%}
body{margin:0}
:root{
  --canvas:#f4f2f0;--card:#fff;--ink:#0c0a08;--panel:#1a1919;--muted:#6d6c6b;--line:#e5e7eb;--smoke:#d3d3d3;--action:#e4f222;
  --green:#1f8a4c;--blue:#2563c9;--amber:#b7791f;--red:#c2410c;--dim:#9a9897;
  --sans:Inter,"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  color-scheme:light
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--canvas:#121110;--card:#1a1919;--ink:#f4f2f0;--panel:#0c0a08;--muted:#a3a19f;--line:#2e2c2b;--smoke:#3a3837;--green:#4ade80;--blue:#7cb3ff;--amber:#f2c14e;--red:#ff8a65;--dim:#6d6c6b;color-scheme:dark}}
:root[data-theme="dark"]{--canvas:#121110;--card:#1a1919;--ink:#f4f2f0;--panel:#0c0a08;--muted:#a3a19f;--line:#2e2c2b;--smoke:#3a3837;--green:#4ade80;--blue:#7cb3ff;--amber:#f2c14e;--red:#ff8a65;--dim:#6d6c6b;color-scheme:dark}
body{background:var(--canvas);color:var(--ink);font:400 16px/1.5 var(--sans);font-feature-settings:"ss01"}
*{font-weight:400}
.wrap{max-width:1100px;margin:0 auto;padding-block:48px 128px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:32px}
.pill{display:inline-flex;gap:8px;align-items:center;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--dim)}
h1{font:400 clamp(44px,8vw,64px)/1 var(--sans);letter-spacing:-.02em;color:var(--ink);margin:12px 0 16px;text-wrap:balance}
.lede{color:var(--muted);font-size:20px;line-height:1.3;max-width:52ch;margin:0}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));background:var(--panel);border-radius:16px;color:#fff}
.strip div{padding:20px 24px;border-left:1px solid #2e2c2b}
.strip div:first-child{border-left:0}
.strip b{display:block;font:400 32px/1.1 var(--sans);color:#fff;font-variant-numeric:tabular-nums}
.strip div:nth-child(5) b{color:var(--action)}
.strip span{font-size:10px;color:#a3a19f;letter-spacing:.05em;text-transform:uppercase}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.tabs{display:flex;flex-wrap:wrap;gap:4px}
button{font:400 14px var(--sans);color:var(--ink);background:transparent;border:1px solid var(--ink);border-radius:6px;padding:0 14px;height:40px;cursor:pointer;transition:background-color .3s ease-out,border-color .3s ease-out}
button:hover{background:var(--card)}
#newBtn,#saveBtn,.primary{background:var(--action);color:#0c0a08;border-color:var(--action);padding:0 20px;height:44px}
#newBtn:hover,#saveBtn:hover,.primary:hover{filter:brightness(.96)}
.tabs button{border-color:transparent;color:var(--muted);height:36px}
.tabs button:hover{background:var(--card)}
.tabs button[aria-pressed=true]{background:var(--card);border-color:var(--line);color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.list{display:grid;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px 28px}
.card>*{grid-column:2}
.card .pic{grid-column:1;grid-row:1/span 7;width:150px;aspect-ratio:6/7;max-width:100%;border-radius:12px;object-fit:cover;background:var(--canvas)}
.card .pic.none{display:grid;place-items:center;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.card h2{font:400 28px/1.14 var(--sans);color:var(--ink);margin:0;letter-spacing:-.01em}
.status{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink)}
.tag{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--canvas);border-radius:6px;padding:2px 8px}
.st-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:3px 10px}
.problem{color:var(--muted);font-size:18px;line-height:1.33;margin:0}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.nums div{background:var(--card);padding:12px 14px}
.nums span{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.nums b{font:400 20px var(--sans);color:var(--ink);font-variant-numeric:tabular-nums}
.notes{color:var(--ink);margin:0;white-space:pre-wrap;min-width:0;overflow-wrap:anywhere;font-size:15px}
details{border-top:1px solid var(--line);padding-top:12px}
summary{cursor:pointer;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.script{white-space:pre-wrap;color:var(--ink);margin:12px 0 0;overflow-wrap:anywhere;unicode-bidi:plaintext;background:var(--canvas);border-radius:12px;padding:16px}
.src{color:var(--ink);font-size:14px;overflow-wrap:anywhere;text-decoration:underline;text-decoration-color:var(--smoke);text-underline-offset:3px}
.src:hover{text-decoration-color:var(--ink)}
.foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.card .actions button{height:32px;font-size:13px;padding:0 12px;border-color:var(--line)}
.card .actions button:hover{border-color:var(--ink)}
.empty{background:var(--card);border:1px dashed var(--smoke);border-radius:16px;padding:40px 24px;color:var(--muted)}
form{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
form .full{grid-column:1/-1}
dialog{width:min(760px,calc(100vw - 32px));max-height:calc(100dvh - 48px);padding:0;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);overflow:auto}
dialog::backdrop{background:rgba(12,10,8,.45);backdrop-filter:blur(8px)}
dialog form{border:0;border-radius:0;padding:8px 24px 24px}
.dlg-head{position:sticky;top:0;z-index:1;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:20px 24px 12px;background:var(--card);border-bottom:1px solid var(--line)}
.dlg-head h3{font:400 24px/1.17 var(--sans);margin:0}
.x{border-color:var(--line);width:36px;height:36px;padding:0}
label{display:grid;gap:6px;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
input,select,textarea{font:400 15px var(--sans);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 14px;text-transform:none;letter-spacing:0}
input[type=number]{font-variant-numeric:tabular-nums}
textarea{min-height:90px;resize:vertical;unicode-bidi:plaintext}
.msg{font-size:13px;color:var(--muted)}
.s-idea{--c:var(--dim)}.s-sourcing{--c:var(--blue)}.s-testing{--c:var(--amber)}.s-winner{--c:var(--green)}.s-stopped{--c:var(--red)}
.status .dot{background:var(--c)}
@media (max-width:620px){.card{grid-template-columns:1fr}.card>*,.card .pic{grid-column:1;grid-row:auto}.card .pic{width:100%;max-width:320px}.strip div{border-left:0;border-top:1px solid #2e2c2b}.strip div:first-child{border-top:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.auth{max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;display:grid;gap:14px}
.auth h3{font:400 24px/1.17 var(--sans);margin:0}
.auth p{margin:0;color:var(--muted);font-size:14px}
.auth .err{color:var(--red)}
.link{border:0;padding:0;height:auto;background:none;color:var(--muted);text-decoration:underline;font-size:13px}
.link:hover{background:none;color:var(--ink)}
</style>
</head><body>

<div class="wrap">
  <header>
    <span class="pill"><span class="dot" id="live"></span><span id="liveText">connecting</span></span>
    <h1>Product Lab</h1>
    <p class="lede">Every product we try, what it cost, what it sold, and whether we keep it. Numbers in Tunisian dinars.</p>
  </header>

  <div id="app" hidden style="display:contents">
  <section class="strip" aria-label="Summary">
    <div><b id="nAll">0</b><span>Products</span></div>
    <div><b id="nTest">0</b><span>Testing</span></div>
    <div><b id="nWin">0</b><span>Winners</span></div>
    <div><b id="nSpend">0</b><span>Ad spend DT</span></div>
    <div><b id="nOrders">0</b><span>Orders</span></div>
  </section>

  <div class="bar">
    <div class="tabs" id="tabs"></div>
    <button id="newBtn">+ Add product</button>
  </div>

  <dialog id="dlg" aria-labelledby="dlgTitle"><div class="dlg-head"><h3 id="dlgTitle">Add product</h3><button type="button" class="x" id="closeBtn" aria-label="Close">✕</button></div>
  <form id="form">
    <label class="full">Product<input id="f-name" required maxlength="80" placeholder="Foldable cutting mat"></label>
    <label>Status<select id="f-status"></select></label>
    <label>Cost per unit (DT)<input id="f-cost" type="number" step="0.01" min="0"></label>
    <label>Selling price (DT)<input id="f-price" type="number" step="0.01" min="0"></label>
    <label>Ad spend (DT)<input id="f-spend" type="number" step="0.01" min="0"></label>
    <label>Orders<input id="f-orders" type="number" step="1" min="0"></label>
    <label>Type<input id="f-type" maxlength="40" list="types" placeholder="Kitchen"></label>
    <label>Test stock (units)<input id="f-units" type="number" step="1" min="0"></label>
    <label>Test budget (DT)<input id="f-budget" type="number" step="0.01" min="0"></label>
    <label class="full">Problem it solves<input id="f-problem" maxlength="200" placeholder="Food falls off the board when you move it to the pot"></label>
    <label class="full">Source / supplier link<input id="f-source" type="url" maxlength="500" placeholder="https://www.alibaba.com/…"></label>
    <label class="full">Image<input id="f-image" type="file" accept="image/*"></label>
    <label class="full">Ad script<textarea id="f-script" maxlength="4000" placeholder="Hook, problem, product, offer, call to action"></textarea></label>
    <label class="full">Notes<textarea id="f-notes" maxlength="1500" placeholder="Supplier, offer, what worked, why we stopped"></textarea></label>
    <datalist id="types"><option value="Kitchen"><option value="Beauty"><option value="Home storage"><option value="Fashion"><option value="Gadget"></datalist>
    <div class="full actions"><button type="submit" id="saveBtn">Save product</button><button type="button" id="cancelBtn">Cancel</button><span class="msg" id="formMsg"></span></div>
  </form></dialog>

  <section class="list" id="list"><div class="empty">Loading products…</div></section>
  <p class="foot" id="who"></p>
  </div>
</div>

<script>
const STATUS={idea:"Idea",sourcing:"Sourcing",testing:"Testing",winner:"Winner",stopped:"Stopped"};
const $=id=>document.getElementById(id);
let rows=[],filter="all",editing=null,editingImage=null,sb=null,canWrite=true;
const NUMS=["cost","price","spend","orders","units","budget"],TEXTS=["type","problem","source","script","notes"];

const num=v=>v===""||v==null||isNaN(+v)?null:+v;
const fmt=v=>v==null?"—":(+v).toLocaleString("en",{maximumFractionDigits:2});

function tabs(){
  $("tabs").innerHTML="";
  [["all","All"],...Object.entries(STATUS)].forEach(([k,l])=>{
    const b=document.createElement("button");b.textContent=l;b.setAttribute("aria-pressed",k===filter);
    b.onclick=()=>{filter=k;tabs();render()};$("tabs").append(b);
  });
}
Object.entries(STATUS).forEach(([k,l])=>$("f-status").add(new Option(l,k)));

function render(){
  const sum=(f)=>rows.reduce((a,r)=>a+(num(r[f])||0),0);
  $("nAll").textContent=rows.length;
  $("nTest").textContent=rows.filter(r=>r.status==="testing").length;
  $("nWin").textContent=rows.filter(r=>r.status==="winner").length;
  $("nSpend").textContent=fmt(sum("spend"));
  $("nOrders").textContent=fmt(sum("orders"));
  const shown=rows.filter(r=>filter==="all"||r.status===filter);
  const L=$("list");L.innerHTML="";
  if(!shown.length){L.innerHTML=`<div class="empty">${rows.length?"No products with this status.":"No products yet. Add the first one with “+ Add product”."}</div>`;return}
  for(const r of shown){
    const cost=num(r.cost),price=num(r.price),spend=num(r.spend),orders=num(r.orders);
    const cpo=spend!=null&&orders?spend/orders:null;
    const margin=price!=null&&cost!=null?price-cost:null;
    const c=document.createElement("article");c.className="card s-"+(r.status||"idea");
    c.innerHTML=`<div class="head"><h2></h2><span class="status"><span class="tag" hidden></span><span class="st-chip"><span class="dot"></span><span class="st"></span></span></span></div>
      <p class="problem" hidden></p>
      <div class="nums">
        <div><span>Cost</span><b>${fmt(cost)}</b></div><div><span>Price</span><b>${fmt(price)}</b></div>
        <div><span>Margin</span><b>${fmt(margin)}</b></div><div><span>Ad spend</span><b>${fmt(spend)}</b></div>
        <div><span>Orders</span><b>${fmt(orders)}</b></div><div><span>Ad cost / order</span><b>${fmt(cpo)}</b></div>
        <div><span>Test stock</span><b>${fmt(num(r.units))}</b></div><div><span>Test budget</span><b>${fmt(num(r.budget))}</b></div>
      </div><p class="notes"></p>
      <details hidden><summary>Ad script</summary><p class="script"></p></details>
      <a class="src" target="_blank" rel="noopener" hidden></a>
      <div class="foot"><span class="when"></span><span class="actions"><button class="e">Edit</button><button class="d">Delete</button></span></div>`;
    let pic;
    if(r.image&&/^https?:\/\//.test(r.image)){pic=document.createElement("img");pic.src=r.image;pic.alt=r.name||"";pic.loading="lazy"}
    else{pic=document.createElement("div");pic.textContent="No image";pic.classList.add("none")}
    pic.classList.add("pic");c.prepend(pic);
    c.querySelector("h2").textContent=r.name||"Untitled";
    if(r.type){const t=c.querySelector(".tag");t.textContent=r.type;t.hidden=false}
    if(r.problem){const p=c.querySelector(".problem");p.textContent=r.problem;p.hidden=false}
    if(r.script){c.querySelector(".script").textContent=r.script;c.querySelector("details").hidden=false}
    if(r.source&&/^https?:\/\//.test(r.source)){const a=c.querySelector(".src");a.href=r.source;a.textContent="Source ↗ "+r.source.replace(/^https?:\/\/(www\.)?/,"").slice(0,48);a.hidden=false}
    c.querySelector(".st").textContent=STATUS[r.status]||"Idea";
    c.querySelector(".notes").textContent=r.notes||"";
    c.querySelector(".when").textContent=r.updated_at?"Updated "+new Date(r.updated_at).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}):"";
    const d=c.querySelector(".d");
    if(!canWrite)c.querySelector(".actions").hidden=true;
    c.querySelector(".e").onclick=()=>openForm(r);
    d.onclick=async()=>{
      if(d.dataset.sure!=="1"){d.dataset.sure="1";d.textContent="Confirm delete";setTimeout(()=>{d.dataset.sure="";d.textContent="Delete"},4000);return}
      const{error}=await sb.from("products").delete().eq("id",r.id);if(error)d.textContent="Couldn't delete";else load()
    };
    L.append(c);
  }
}

function openForm(r){
  editing=r?r.id:null;$("formMsg").textContent="";$("dlgTitle").textContent=r?"Edit product":"Add product";
  if(!$("dlg").open)$("dlg").showModal();
  $("f-name").value=r?.name||"";$("f-status").value=r?.status||"idea";
  for(const k of NUMS)$("f-"+k).value=r?.[k]??"";
  for(const k of TEXTS)$("f-"+k).value=r?.[k]||"";
  $("f-image").value="";editingImage=r?.image||null;$("saveBtn").textContent=r?"Save changes":"Save product";$("f-name").focus();
}
$("newBtn").onclick=()=>openForm(null);
$("cancelBtn").onclick=$("closeBtn").onclick=()=>$("dlg").close();
$("dlg").addEventListener("click",e=>{if(e.target===$("dlg"))$("dlg").close()});
$("form").addEventListener("submit",async e=>{
  e.preventDefault();if(!sb){$("formMsg").textContent="Not connected yet.";return}
  const data={name:$("f-name").value.trim(),status:$("f-status").value,updated_at:new Date().toISOString(),image:editingImage};
  for(const k of NUMS)data[k]=num($("f-"+k).value);
  for(const k of TEXTS)data[k]=$("f-"+k).value.trim()||null;
  $("formMsg").textContent="Saving…";
  try{
    const f=$("f-image").files[0];
    if(f){
      $("formMsg").textContent="Uploading image…";
      const path=Date.now()+"-"+f.name.replace(/[^\w.-]+/g,"_");
      const up=await sb.storage.from("product-images").upload(path,f,{contentType:f.type});
      if(up.error)throw up.error;
      data.image=sb.storage.from("product-images").getPublicUrl(path).data.publicUrl;
    }
    const q=editing?sb.from("products").update(data).eq("id",editing):sb.from("products").insert(data);
    const{error}=await q;if(error)throw error;
    $("dlg").close();load();
  }catch(err){$("formMsg").textContent="Couldn't save: "+(err?.message||"check your connection")}
});

function setLive(t,c){$("liveText").textContent=t;$("live").style.background=c}
tabs();
const SB_URL="https://caajpoyjvmbxmyblmuun.supabase.co",SB_KEY="sb_publishable_L-Q_0wU-nZ6j9W9RrzlpFA_dfOK2dJS";
const show=id=>{for(const x of["app"])$(x).hidden=x!==id};

async function load(){
  const{data,error}=await sb.from("products").select("*").order("updated_at",{ascending:false});
  if(error){setLive("error","var(--red)");$("list").innerHTML=`<div class="empty"></div>`;$("list").firstChild.textContent="Couldn't load products: "+error.message;return}
  rows=data;setLive("live · shared","var(--green)");render();
}
let chan=null;
show("app");
if(window.supabase?.createClient){
  sb=supabase.createClient(SB_URL,SB_KEY);
  load();
  chan=sb.channel("products").on("postgres_changes",{event:"*",schema:"public",table:"products"},()=>load()).subscribe();
}else{setLive("offline","var(--red)");$("list").innerHTML='<div class="empty">Couldn\'t load the Supabase library. Check your internet and reload.</div>'}
</script>
</body></html>
